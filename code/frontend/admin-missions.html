
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Missions - CleanGoa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="missions-container admin-missions">

    <h1>Manage Cleanliness Missions</h1>


    <h2>Create a New Mission</h2>

    <form class="admin-mission-form"
      th:action="@{/admin/missions}"
      th:object="${mission}"
      method="post">

        <label>Mission Title</label>
        <input type="text" th:field="*{title}" required maxlength="255">

        <label>Description</label>
        <textarea th:field="*{description}" required maxlength="2000"></textarea>

        <label>Location</label>
        <input type="text" th:field="*{locationName}" required maxlength="255">

        <label>Event Date and Time</label>
        <input type="datetime-local" th:field="*{eventDate}" required>

        <label>Maximum Volunteers</label>
        <input type="number" th:field="*{maxVolunteers}" min="1" required>

        <button class="mission-button" type="submit">Create Mission</button>

    </form>

    <hr>

    <h2>Existing Missions</h2>

    <p th:if="${#lists.isEmpty(missions)}">No missions created yet.</p>

    <div class="mission-card" th:each="m : ${missions}">
        <h3 th:text="${m.title}">Mission title</h3>
        <p th:text="${m.description}">Description</p>
        <p>
            <strong>Location:</strong>
            <span th:text="${m.locationName}"></span>
        </p>
        <p>
            <strong>Date:</strong>
            <span th:text="${#temporals.format(m.eventDate, 'dd-MM-yyyy HH:mm')}"></span>
        </p>
        <p>
            <strong>Maximum Volunteers:</strong>
            <span th:text="${m.maxVolunteers}"></span>
        </p>

        <div class="mission-actions">

    <a class="primary-btn"
       th:href="@{/admin/missions/edit/{id}(id=${m.id})}">
        Edit Mission
    </a>

    <form th:action="@{/admin/missions/delete/{id}(id=${m.id})}"
          method="post"
          onsubmit="return confirm('Are you sure you want to delete this mission?');">

        <button type="submit" class="mission-delete-btn">
            Delete Mission
        </button>

    </form>

</div>

        <hr>
    </div>

    <p class="mission-links">
    <a class="secondary-btn" th:href="@{/admin/dashboard}">
        Back to Dashboard
    </a>
</p>
</main>
</body>
</html>
