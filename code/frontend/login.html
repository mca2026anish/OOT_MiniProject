<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CleanGoa</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header>
        <div class="logo">CleanGoa</div>

        <nav>
            <a href="/">Home</a>
            <a href="/signup">Sign Up</a>
        </nav>
    </header>

    <main class="signup-container">

        <div class="signup-card">

            <h1>Welcome Back!</h1>

            <p class="signup-description">
                Log in to continue helping keep Goa clean.
            </p>

            <div class="error-message" th:if="${param.error}">
                Invalid email or password.
            </div>

            <div class="success-message" th:if="${param.logout}">
                You have logged out successfully.
            </div>

            <form th:action="@{/login}" method="post">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

                <button type="submit" class="primary-btn">
                    Login
                </button>

            </form>

            <p class="signup-footer">
                Don't have an account?
                <a href="/signup">Create Account</a>
            </p>

        </div>

    </main>

    <footer>
        <p>CleanGoa — Small Actions, Cleaner Goa.</p>
    </footer>

</body>
</html>
